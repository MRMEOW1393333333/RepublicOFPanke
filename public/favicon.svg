<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Seal -->
  <circle cx="200" cy="200" r="190" fill="#0c0a09" stroke="#f59e0b" stroke-width="6" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Tricolor Arc Rings -->
  <path d="M 40,200 A 160,160 0 0,1 200,40" stroke="#16a34a" stroke-width="14" fill="none" />
  <path d="M 200,40 A 160,160 0 0,1 360,200" stroke="#16a34a" stroke-width="14" fill="none" />
  <path d="M 40,200 A 160,160 0 0,0 200,360" stroke="#dc2626" stroke-width="14" fill="none" />
  <path d="M 200,360 A 160,160 0 0,0 360,200" stroke="#dc2626" stroke-width="14" fill="none" />

  <!-- Republic of Panke Text Arc -->
  <text x="200" y="70" font-family="'Vazirmatn', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">جمهوری پنکه</text>
  <text x="200" y="340" font-family="'Vazirmatn', sans-serif" font-weight="700" font-size="13" fill="#fbbf24" text-anchor="middle" letter-spacing="3">REPUBLIC OF PANKE • EST. 2023</text>

  <!-- Center Golden Laurel Wreath and Fan -->
  <g transform="translate(200, 195) scale(1.15)" filter="url(#shadowFilter)">
    <!-- Laurel Wreath Left -->
    <path d="M-8,65 C-45,60 -75,30 -78,-10 C-80,-45 -60,-75 -25,-90 C-32,-70 -30,-45 -18,-25 C-35,-15 -48,5 -45,30 C-42,50 -25,62 -8,65 Z" fill="url(#emblemGold)" />
    <!-- Laurel Wreath Right -->
    <path d="M8,65 C45,60 75,30 78,-10 C80,-45 60,-75 25,-90 C32,-70 30,-45 18,-25 C35,-15 48,5 45,30 C42,50 25,62 8,65 Z" fill="url(#emblemGold)" />

    <!-- Leaves -->
    <g fill="url(#emblemGold)">
      <path d="M-20,-75 C-35,-82 -48,-78 -52,-68 C-50,-60 -40,-62 -25,-68 Z" />
      <path d="M-38,-48 C-55,-52 -68,-42 -70,-30 C-64,-25 -52,-30 -38,-40 Z" />
      <path d="M-45,-15 C-65,-15 -74,2 -72,15 C-64,18 -55,10 -43,-5 Z" />
      <path d="M-40,20 C-58,28 -62,48 -55,60 C-48,58 -44,45 -36,30 Z" />
      
      <path d="M20,-75 C35,-82 48,-78 52,-68 C50,-60 40,-62 25,-68 Z" />
      <path d="M38,-48 C55,-52 68,-42 70,-30 C64,-25 52,-30 38,-40 Z" />
      <path d="M45,-15 C65,-15 74,2 72,15 C64,18 55,10 43,-5 Z" />
      <path d="M40,20 C58,28 62,48 55,60 C48,58 44,45 36,30 Z" />
      <circle cx="0" cy="65" r="5" fill="#f59e0b" />
    </g>

    <!-- Fan Stand -->
    <rect x="-4.5" y="-10" width="9" height="75" rx="3" fill="url(#emblemGold)" />
    <ellipse cx="0" cy="65" rx="22" ry="7" fill="url(#emblemGold)" />
    <circle cx="0" cy="15" r="6" fill="#b45309" />

    <!-- Fan Motor Hub -->
    <circle cx="0" cy="-10" r="14" fill="url(#emblemGold)" stroke="#b45309" stroke-width="2" />
    <circle cx="0" cy="-10" r="5" fill="#78350f" />

    <!-- 3 Fan Blades -->
    <path d="M0,-10 C8,-28 18,-42 35,-48 C44,-51 50,-42 46,-30 C40,-15 25,-8 10,-6 Z" fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.5" />
    <path d="M0,-10 C18,-6 32,4 42,20 C48,28 40,36 28,34 C12,30 2,16 0,-2 Z" fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.5" />
    <path d="M0,-10 C-18,-14 -35,-12 -46,0 C-52,8 -46,18 -32,18 C-18,18 -6,6 -2,-5 Z" fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.5" />
  </g>
</svg>
